# Picom compositor configuration
# Optimized for AwesomeWM + Catppuccin theme

# Backend
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

# Shadows
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.7;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [];

# Transparency
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
    "95:class_g = 'Alacritty'",
    "95:class_g = 'Thunar'"
];

# Rounded corners
corner-radius = 6.0;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Window rules
blur:
{
    method = "gaussian";
    size = 10;
    deviation = 5.0;
};

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Focus/exclude rules
focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'Conky'"
];

# Detect rounded corners
detect-rounded-corners = true;
detect-client-opacity = true;

# Other
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;
detect-client-leader = true;

inactive-opacity = 0.9;
inactive-opacity = 1.0;
blur-method = none;
blur-method = gaussian;
blur-method = none;
inactive-opacity = 0.9;
inactive-opacity = 1.0;
blur-method = none;
blur-method = gaussian;
inactive-opacity = 0.9;
inactive-opacity = 0.9;
inactive-opacity = 1.0;